name: Check scripts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every script in index.html
        run: node scripts/check-scripts.mjs
      - name: Engine tests
        run: node tests/engine/suite.mjs
      - name: Engine fuzz run
        run: node tests/engine/fuzz.mjs 400
